<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Techto Electronics – Upload Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://i.postimg.cc/cCf7fTfX/df-removebg-preview-1.png" alt="Logo" />
      <div class="title">Techto Electronics</div>
    </div>

    <!-- STEP 1 -->
    <div id="step1" class="step active">
      <input type="text" id="fullName" placeholder="Прізвище Ім’я По батькові" />
      <button class="btn primary" onclick="goToStep2()">Confirm</button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="step">
      <div class="file-upload">
        <input type="file" id="fileInput" multiple hidden />
        <div class="file-input-wrapper">
          <input type="text" id="fileCount" readonly placeholder="Файли не обрано" />
          <button type="button" id="chooseFilesBtn" class="btn secondary">📎 Choose</button>
        </div>
      </div>
      <button class="btn primary" onclick="upload()">Upload File</button>
    </div>

    <div id="loader" class="loader"></div>
    <div id="status" class="status"></div>
    <div class="footer">With care, Techto HR Team</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
