<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Techto Upload</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="logo">
      <img src="https://i.postimg.cc/cCf7fTfX/df-removebg-preview-1.png" alt="Logo" />
      <h1>Techto Electronics</h1>
    </header>

    <!-- Step 1 -->
    <div id="step1" class="step">
      <input type="text" id="fullName" placeholder="Enter your full name" />
      <button class="btn" onclick="goToStep2()">Confirm</button>
    </div>

    <!-- Step 2 -->
    <div id="step2" class="step hidden">
      <div class="file-group">
        <input type="file" id="fileInput" multiple hidden />
        <input type="text" id="fileLabel" readonly placeholder="No files selected" />
        <button class="btn ghost" onclick="document.getElementById('fileInput').click()">Choose</button>
      </div>
      <button class="btn" onclick="upload()">Upload Files</button>
    </div>

    <div id="loader" class="loader"></div>
    <div id="status"></div>
    <footer class="footer">With care, Techto HR Team</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
